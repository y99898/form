<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, shrink-to-fit=no">
  <title>انضم لفريق درّاجة الحمدانية | قوة • حرية • طاقة</title>
  
  <!-- خطوط عصرية من Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Changa:wght@500;700;800&display=swap" rel="stylesheet">
  
  <!-- Font Awesome 6 للأيقونات -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    /* السماح بالتحديد في الحقول فقط */
    input, select, textarea {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    body {
      font-family: 'Cairo', 'Changa', sans-serif;
      background: #0a0f1e;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
      background: radial-gradient(circle at 20% 30%, #1a1f35 0%, #0b0d17 70%);
    }

    /* طبقة الجسيمات المتحركة */
    .animated-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
      animation: floatOrb 15s infinite ease-in-out;
    }

    .orb-1 {
      width: 500px;
      height: 500px;
      background: linear-gradient(135deg, #ff3cac 0%, #784ba0 50%, #2b86c5 100%);
      top: -150px;
      left: -100px;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 450px;
      height: 450px;
      background: linear-gradient(135deg, #f9d423 0%, #ff4e50 100%);
      bottom: -120px;
      right: -80px;
      animation-delay: -5s;
    }

    .orb-3 {
      width: 350px;
      height: 350px;
      background: linear-gradient(135deg, #00dbde 0%, #fc00ff 100%);
      top: 40%;
      left: 40%;
      animation-delay: -9s;
      opacity: 0.4;
    }

    @keyframes floatOrb {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(40px, -30px) scale(1.05); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* الحاوية الرئيسية */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 580px;
      background: rgba(20, 25, 45, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 40px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(255, 110, 150, 0.2), 0 0 40px rgba(0, 212, 255, 0.3);
      padding: 35px 25px;
      transition: all 0.4s ease;
      animation: slideUp 1s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(40px);
    }

    @keyframes slideUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* شعار وعنوان */
    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      font-size: 3.5rem;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 30%, #fad0c4 60%, #ff6a88 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 15px #ff4d6d);
      margin-bottom: 5px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    h2 {
      font-size: 2.1rem;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 0 15px #ff3366, 0 0 30px #ff6b9e;
      letter-spacing: 1px;
      line-height: 1.3;
      margin: 10px 0 8px;
    }

    .subtitle {
      color: #b3c6ff;
      font-size: 1rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* استمارة */
    form {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .input-group {
      position: relative;
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 700;
      font-size: 1rem;
      color: #ffe484;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(255,200,0,0.5);
    }

    label i {
      color: #ff9f4b;
      font-size: 1.2rem;
      transition: all 0.3s ease;
    }

    input, select, textarea {
      background: rgba(10, 15, 27, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 20px;
      padding: 15px 20px;
      font-size: 1rem;
      font-family: 'Cairo', sans-serif;
      color: #ffffff;
      outline: none;
      transition: all 0.3s ease;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    input:focus, select:focus, textarea:focus {
      border-color: #ff4d6d;
      box-shadow: 0 0 25px rgba(255, 77, 109, 0.7), 0 0 10px rgba(255, 200, 0, 0.5);
      background: rgba(20, 25, 40, 0.85);
      transform: scale(1.01);
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    select option {
      background: #1a1f35;
      color: #fff;
    }

    /* ============ قسم رفع الصورة الشخصية ============ */
    .photo-upload-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .photo-preview-container {
      position: relative;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 30px rgba(255, 77, 109, 0.4), 0 10px 30px rgba(0,0,0,0.5);
      background: rgba(10, 15, 27, 0.7);
      backdrop-filter: blur(10px);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .photo-preview-container:hover {
      border-color: #ff4d6d;
      box-shadow: 0 0 40px rgba(255, 77, 109, 0.8);
      transform: scale(1.05);
    }

    .photo-preview-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .photo-preview-container .placeholder-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 4rem;
      color: rgba(255, 255, 255, 0.5);
      transition: all 0.3s ease;
    }

    .photo-preview-container.has-image .placeholder-icon {
      display: none;
    }

    .photo-preview-container.has-image img {
      display: block;
    }

    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
    }

    .upload-btn {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      border: none;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
    }

    .upload-btn:hover {
      background: linear-gradient(135deg, #764ba2, #667eea);
      box-shadow: 0 8px 25px rgba(118, 75, 162, 0.6);
      transform: translateY(-2px);
    }

    .upload-btn-wrapper input[type="file"] {
      position: absolute;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .remove-photo-btn {
      background: rgba(255, 77, 109, 0.2);
      border: 1px solid rgba(255, 77, 109, 0.5);
      color: #ff6b8a;
      padding: 6px 15px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: none;
    }

    .remove-photo-btn.visible {
      display: inline-block;
    }

    .remove-photo-btn:hover {
      background: rgba(255, 77, 109, 0.4);
      color: #fff;
    }

    /* زر الإرسال */
    .submit-btn {
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      border: none;
      color: white;
      font-weight: 800;
      font-size: 1.4rem;
      padding: 16px 25px;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 30px rgba(255, 75, 43, 0.5), 0 0 25px #ff3366;
      margin-top: 15px;
      border: 1px solid rgba(255,255,255,0.2);
      text-transform: uppercase;
    }

    .submit-btn:hover {
      background: linear-gradient(135deg, #ff6b4a, #ff2e5f);
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(255, 50, 80, 0.8), 0 0 35px #ffae42;
      letter-spacing: 3px;
    }

    .submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .submit-btn i {
      font-size: 1.4rem;
    }

    /* رسالة التنبيه */
    .notification {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.9);
      color: #fff;
      padding: 15px 30px;
      border-radius: 50px;
      z-index: 9999;
      font-weight: 700;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
      display: none;
      animation: fadeInDown 0.5s ease;
      text-align: center;
      max-width: 90%;
    }

    .notification.success {
      border-color: #33cc99;
      box-shadow: 0 0 30px rgba(51, 204, 153, 0.5);
    }

    .notification.error {
      border-color: #ff4d6d;
      box-shadow: 0 0 30px rgba(255, 77, 109, 0.5);
    }

    .notification.warning {
      border-color: #ffae42;
      box-shadow: 0 0 30px rgba(255, 174, 66, 0.5);
    }

    @keyframes fadeInDown {
      from {
        opacity: 0;
        transform: translate(-50%, -50px);
      }
      to {
        opacity: 1;
        transform: translate(-50%, 0);
      }
    }

    /* تأثير متوهج */
    .glow-text {
      animation: glowPulse 2s infinite alternate;
    }

    @keyframes glowPulse {
      from { text-shadow: 0 0 10px #ff4d6d, 0 0 20px #ff0040; }
      to { text-shadow: 0 0 20px #ffb347, 0 0 40px #ff8c00; }
    }

    @media (max-width: 500px) {
      .container {
        padding: 25px 18px;
        border-radius: 30px;
      }
      h2 {
        font-size: 1.6rem;
      }
      input, select, textarea {
        padding: 12px 15px;
        font-size: 0.9rem;
      }
      .photo-preview-container {
        width: 120px;
        height: 120px;
      }
    }
  </style>
</head>
<body>

  <!-- خلفية متحركة -->
  <div class="animated-bg">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- رسالة التنبيه -->
  <div class="notification" id="notification"></div>

  <!-- بطاقة الاستمارة -->
  <div class="container">
    <div class="header">
      <div class="logo-icon">
        <i class="fas fa-biking"></i> <span style="font-size: 2.5rem;">⚙️</span>
      </div>
      <h2 class="glow-text">انضم إلى درّاجة الحمدانية</h2>
      <div class="subtitle">
        <i class="fas fa-fire"></i> قوة · سرعة · طاقة <i class="fas fa-bolt"></i>
      </div>
    </div>

    <form id="joinForm">
      
      <!-- ============ قسم الصورة الشخصية ============ -->
      <div class="photo-upload-group">
        <label style="text-align: center; width: 100%;">
          <i class="fas fa-camera-retro"></i> الصورة الشخصية
        </label>
        
        <div class="photo-preview-container" id="photoPreview" title="اضغط لتغيير الصورة">
          <img id="previewImage" src="" alt="الصورة الشخصية">
          <i class="fas fa-user-circle placeholder-icon" id="placeholderIcon"></i>
        </div>
        
        <div style="display: flex; gap: 10px; align-items: center;">
          <div class="upload-btn-wrapper">
            <button type="button" class="upload-btn">
              <i class="fas fa-cloud-upload-alt"></i> اختر صورة
            </button>
            <input type="file" id="photoInput" name="photo" accept="image/*" capture="user">
          </div>
          <button type="button" class="remove-photo-btn" id="removePhotoBtn">
            <i class="fas fa-trash-alt"></i> حذف
          </button>
        </div>
        <small style="color: #aaa; font-size: 0.75rem;">الصيغ المدعومة: JPG, PNG, GIF (اختياري)</small>
      </div>

      <div class="input-group">
        <label><i class="fas fa-user-circle"></i> الاسم الثلاثي</label>
        <input type="text" name="fullname" id="fullname" placeholder="أدخل اسمك الكامل" required autocomplete="name">
      </div>

      <div class="input-group">
        <label><i class="fab fa-whatsapp"></i> رقم الواتساب</label>
        <input type="tel" name="whatsapp" id="whatsapp" placeholder="مثال: 0770 123 4567" required dir="ltr" style="text-align: right;">
      </div>

      <div class="input-group">
        <label><i class="fas fa-venus-mars"></i> الجنس</label>
        <select name="gender" id="gender" required>
          <option value="" disabled selected>-- اختر --</option>
          <option value="ذكر">⚡ ذكر</option>
          <option value="أنثى">✨ أنثى</option>
        </select>
      </div>

      <div class="input-group">
        <label><i class="fas fa-map-marker-alt"></i> العنوان بالتفصيل</label>
        <textarea name="address" id="address" rows="3" placeholder="المحافظة / القضاء / الحي ..." required></textarea>
      </div>

      <div class="input-group">
        <label><i class="fas fa-calendar-alt"></i> العمر</label>
        <input type="number" name="age" id="age" placeholder="العمر بالسنوات" min="10" max="80" required>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <i class="fas fa-paper-plane"></i> انطلق الآن <i class="fas fa-flag-checkered"></i>
      </button>
    </form>
    
    <div style="margin-top: 20px; color: #aaa; font-size: 0.8rem; display: flex; justify-content: center; gap: 15px;">
      <span><i class="fas fa-shield-alt"></i> بياناتك آمنة</span>
      <span><i class="fas fa-tachometer-alt"></i> فريق المحترفين</span>
    </div>
  </div>

  <script>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      
  </script>

  <!-- ============ حماية قوية: تعطيل Inspect وأدوات المطورين ============ -->
  <script>
    // تعطيل الزر الأيمن للفأرة
    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      return false;
    });

    // تعطيل اختصارات لوحة المفاتيح للمطورين
    document.addEventListener('keydown', function(e) {
      // F12
      if (e.keyCode === 123) {
        e.preventDefault();
        return false;
      }
      
      // Ctrl+Shift+I (Inspect)
      if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
        e.preventDefault();
        return false;
      }
      
      // Ctrl+Shift+J (Console)
      if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
        e.preventDefault();
        return false;
      }
      
      // Ctrl+Shift+C (Select element)
      if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
        e.preventDefault();
        return false;
      }
      
      // Ctrl+U (View source)
      if (e.ctrlKey && e.keyCode === 85) {
        e.preventDefault();
        return false;
      }
      
      // Ctrl+S (Save page)
      if (e.ctrlKey && e.keyCode === 83) {
        e.preventDefault();
        return false;
      }
      
      // Ctrl+Shift+K (Firefox Console)
      if (e.ctrlKey && e.shiftKey && e.keyCode === 75) {
        e.preventDefault();
        return false;
      }
    });

    // كشف فتح DevTools عن طريق تغير حجم النافذة
    (function() {
      const threshold = 160;
      let devtoolsOpen = false;
      
      function detectDevTools() {
        const widthThreshold = window.outerWidth - window.innerWidth > threshold;
        const heightThreshold = window.outerHeight - window.innerHeight > threshold;
        
        if (widthThreshold || heightThreshold) {
          if (!devtoolsOpen) {
            devtoolsOpen = true;
            // يمكنك إضافة إجراء هنا مثل إظهار تحذير
            console.clear();
            console.log('%cتحذير!', 'color: red; font-size: 30px;');
            console.log('%cهذه المنطقة مخصصة للمطورين فقط', 'font-size: 20px;');
          }
        } else {
          devtoolsOpen = false;
        }
      }
      
      setInterval(detectDevTools, 1000);
    })();

    // تعطيل السحب والإفلات (لمنع فتح الملفات في المتصفح)
    document.addEventListener('dragover', function(e) {
      e.preventDefault();
      return false;
    }, false);

    document.addEventListener('drop', function(e) {
      e.preventDefault();
      return false;
    }, false);

    // رسالة تحذير في الكونسول
    console.clear();
    console.log('%c⚠️ تحذير أمني ⚠️', 'color: #ff4d6d; font-size: 40px; font-weight: bold;');
    console.log('%cتم تعطيل أدوات المطورين لحماية البيانات', 'color: #ffae42; font-size: 20px;');
    console.log('%cفريق درّاجة الحمدانية 🚴‍♂️', 'color: #33cc99; font-size: 18px;');
  </script>

</body>
</html>
